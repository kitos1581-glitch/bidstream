# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # Flutter's UIScene migrator is disabled until the managed FlutterFire graph
  # supports the scene lifecycle without losing cold-start notifications.
  config:
    # Flutter uses Swift Package Manager for compatible plugins and CocoaPods
    # for the rest. Projects using the managed Firebase Analytics/GenUI graph
    # stay CocoaPods-only so privacy behavior and wrapper versions are stable.
    enable-swift-package-manager: true
    enable-uiscene-migration: false

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  shaders:
    - packages/material_palette/shaders/fbm_gradient.frag

  assets:
    - assets/fonts/
    - assets/images/
    - assets/videos/
    - assets/audios/
    - assets/rive_animations/
    - assets/pdfs/
    - assets/jsons/



