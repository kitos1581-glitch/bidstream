# Pruebas automáticas de BidStream.
# Corren en cada push y pull request. NO despliegan nada, NO usan
# credenciales reales: el backend usa servicios simulados y las reglas el
# emulador oficial con un proyecto de demostración (demo-bidstream).
name: Pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Cloud Functions)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json
      - run: npm ci
        working-directory: firebase/functions
      - run: ../../.github/scripts/run_and_report.sh "Backend npm test" npm test
        working-directory: firebase/functions

  reglas:
    name: Reglas de Firestore (emulador oficial)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g firebase-tools
      - run: npm ci
        working-directory: firebase/rules-tests
      - run: ../../.github/scripts/run_and_report.sh "Reglas (emulador)" npm test
        working-directory: firebase/rules-tests

  app:
    name: App Flutter (analyze, test, build web)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: .github/scripts/run_and_report.sh "flutter pub get" flutter pub get
      - name: flutter analyze
        run: .github/scripts/run_and_report.sh "flutter analyze" flutter analyze --no-fatal-infos
      - name: flutter test
        if: success() || failure()
        run: .github/scripts/run_and_report.sh "flutter test" flutter test
      - name: flutter build web
        if: success() || failure()
        run: .github/scripts/run_and_report.sh "flutter build web" flutter build web --release
